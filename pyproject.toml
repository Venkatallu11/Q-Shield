[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qshield"
version = "0.5.0"
description = "A falsifiable model for attack-path-aware post-quantum migration planning, with trust-hierarchy and threat-class modelling for identity infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["post-quantum", "cryptography", "crypto-agility", "migration", "risk-model", "pki", "identity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]
# The library is deliberately dependency-free: every number in a report is
# produced by code in this repository, so a result cannot silently change when a
# third-party default changes.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
qshield = "qshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: exercises a full experiment; excluded from the fast suite"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 flags function calls in argument defaults, which is a hazard only for
# mutable defaults. Every such default here is a frozen dataclass used as a
# named, immutable configuration value; the alternative (None plus a body-level
# fallback) hides the default from the signature and the generated docs.
ignore = ["B008"]
