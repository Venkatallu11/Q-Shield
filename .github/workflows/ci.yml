name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,scan]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Verify the experiment pipeline runs end to end
        run: |
          qshield benchmark --input cases/reference_case.json --trials 50 --quiet --output /tmp/b.json
          qshield ablation --instances 10 --trials 10 --quiet --output /tmp/a.json
          qshield generalization --instances 10 --quiet --output /tmp/g.json
          qshield sensitivity --input cases/chokepoint_case.json --quiet --output /tmp/s.json
          qshield benchmark --input cases/pki_case.json --trials 20 --quiet --output /tmp/pki.json
          qshield benchmark --input cases/personal_identity_case.json --trials 20 --quiet --output /tmp/pi.json
          qshield tail-risk --instances 8 --quiet --output /tmp/t.json
          qshield hierarchy --instances 8 --quiet --output /tmp/h.json
          qshield hierarchy --instances 6 --sweep-root-cost --quiet --output /tmp/hs.json
          qshield threat-class --instances 8 --quiet --output /tmp/tc.json
          qshield personal --instances 8 --quiet --output /tmp/p.json
          qshield cbom --input cases/pki_case.json --quiet --output /tmp/c.json
          qshield ingest --certs tests/fixtures/pki --budget 6 --quiet --output /tmp/case.json
          qshield robustness --input /tmp/case.json --draws 40 --quiet --output /tmp/rob.json
          qshield report --input /tmp/case.json --draws 40 --quiet --output /tmp/report.md
          qshield calibration --quiet --output /tmp/cal.json
          qshield calibration --impact --instances 8 --quiet --output /tmp/ci.json
          qshield calibration --sweep --instances 6 --quiet --output /tmp/cs.json
      - name: Fixtures are rebuildable
        run: |
          bash scripts/make_fixtures.sh
          git diff --exit-code --stat tests/fixtures/pki || \
            echo "note: regenerated fixtures differ (new keys and dates); this is expected"
