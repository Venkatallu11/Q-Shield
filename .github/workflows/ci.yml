name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Verify the experiment pipeline runs end to end
        run: |
          qshield benchmark --input cases/reference_case.json --trials 50 --quiet --output /tmp/b.json
          qshield ablation --instances 10 --trials 10 --quiet --output /tmp/a.json
          qshield generalization --instances 10 --quiet --output /tmp/g.json
          qshield sensitivity --input cases/chokepoint_case.json --quiet --output /tmp/s.json
